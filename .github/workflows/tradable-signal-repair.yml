name: Repair and verify tradable signals
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tradable-signal-repair.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: tradable-signal-repair
  cancel-in-progress: false
jobs:
  verify-and-reanalyse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt 'exchange-calendars>=4.8,<5'
      - name: Verify tradability, evidence, risk and message contracts
        env:
          PYTHONPATH: tests
        run: python -m unittest test_tradable_signal test_execution_quotes test_peer_expansion test_evidence_repair test_optional_news test_event_impact_analysis test_composite_signal test_daily_delivery_update test_sector_leadership test_sector_update test_catalyst_policy test_preopen_signals -v
      - name: Verify the actual read-only execution provider
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import json
          from execution_quotes import execution_quote
          now=datetime.now(ZoneInfo('Asia/Seoul'))
          try:
              quote=execution_quote('005930.KS',now)
              print('EXECUTION_PROVIDER_HEALTH='+json.dumps(dict(status='verified',quote=quote,trade_order_sent=False),ensure_ascii=False),flush=True)
          except Exception as exc:
              print('EXECUTION_PROVIDER_HEALTH='+json.dumps(dict(status='unavailable',error=type(exc).__name__,trade_order_sent=False)),flush=True)
          PY
      - name: Reanalyse current equities and send only truthfully labelled results
        env:
          GH_TOKEN: ${{ github.token }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u requested_buy_report.py --session 2026-11-20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-tradable-signal-evidence
          path: requested-buy-*
          if-no-files-found: ignore
