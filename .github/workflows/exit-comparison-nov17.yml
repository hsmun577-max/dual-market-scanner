name: Exit policy comparison through Nov17
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/exit-comparison-nov17.yml'
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt 'exchange-calendars>=4.8,<5'
      - name: Load fixed historical candidate entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 44210570303 --name weekly-through-nov17 --dir baseline
      - name: Compare sell policies with identical entries
        run: |
          python - <<'PY'
          import json, math, statistics
          from pathlib import Path
          from datetime import timedelta
          from concurrent.futures import ThreadPoolExecutor
          import pandas as pd
          import yfinance as yf
          import exchange_calendars as xc
          
          END = "2026-11-17"
          COST = 0.0015
          POLICIES = ("fixed_2_6", "support_5m_volume", "support_15m_volume", "lower_high_low_15m")
          source = json.loads(Path("baseline/weekly-through-nov17.json").read_text(encoding="utf-8"))
          orders = source["trades"]
          calendars = {"KR": xc.get_calendar("XKRX"), "US": xc.get_calendar("XNYS")}
          
          def sell_signals(frame, minutes, structural=False):
              if minutes == 15:
                  bars = frame.resample("15min", origin="start_day").agg(
                      {"Open":"first","High":"max","Low":"min","Close":"last","Volume":"sum"})
                  counts = frame["Close"].resample("15min", origin="start_day").count()
                  bars = bars.loc[counts == 3].dropna()
              else:
                  bars = frame.dropna(subset=["Open","High","Low","Close","Volume"])
              result = {}
              for index in range(2, len(bars)):
                  section = bars.iloc[index-2:index+1]
                  starts = section.index
                  if any(starts[i+1]-starts[i] != pd.Timedelta(minutes=minutes) for i in (0,1)):
                      continue
                  a, b, c = (section.iloc[i] for i in (0,1,2))
                  if min(float(a.Volume),float(b.Volume),float(c.Volume)) <= 0:
                      continue
                  if structural:
                      triggered = (c.High < b.High < a.High and c.Low < b.Low < a.Low and c.Close < b.Low)
                  else:
                      triggered = c.Close < min(a.Low,b.Low) and c.Volume >= 1.5*((a.Volume+b.Volume)/2)
                  if triggered:
                      result[starts[-1]+pd.Timedelta(minutes=minutes)] = True
              return result
          
          def net(entry, price):
              return 100*(price*(1-COST)/(entry*(1+COST))-1)
          
          def simulate(frame, expected, entry, signal_map):
              stop, take = entry*0.98, entry*1.06
              pending = None
              last = None
              entered_at = expected[0]
              for at in expected:
                  if at not in frame.index:
                      return {"status":"incomplete","reason":"missing_5m_bar","at":at.isoformat()}
                  bar = frame.loc[at]
                  values = [float(bar[k]) for k in ("Open","High","Low","Close","Volume")]
                  op, hi, lo, cl, vol = values
                  if not all(math.isfinite(v) for v in values) or min(op,hi,lo,cl)<=0 or vol<=0:
                      return {"status":"incomplete","reason":"missing_or_zero_volume_bar","at":at.isoformat()}
                  if not lo <= min(op,cl) <= max(op,cl) <= hi:
                      return {"status":"incomplete","reason":"invalid_ohlc"}
                  if pending is not None:
                      return {"status":"closed","reason":"bearish_signal","exit_price":op,
                              "exit_at":at.isoformat(),"trigger_at":pending.isoformat(),"net_pct":net(entry,op)}
                  reason, price = None, None
                  if op <= stop:
                      reason, price = "stop_gap", op
                  elif op >= take:
                      reason, price = "take_gap", op
                  elif lo <= stop:
                      reason, price = "stop_2pct", stop
                  elif hi >= take:
                      reason, price = "take_6pct", take
                  if reason:
                      return {"status":"closed","reason":reason,"exit_price":price,
                              "exit_at":at.isoformat(),"net_pct":net(entry,price)}
                  closed_at = at + pd.Timedelta(minutes=5)
                  if signal_map.get(closed_at) and closed_at > entered_at:
                      pending = closed_at
                  last = (closed_at, cl)
              if last is None:
                  return {"status":"incomplete","reason":"empty_sample"}
              return {"status":"open_at_valuation","observed_until":last[0].isoformat(),
                      "last_close":last[1],"net_pct":net(entry,last[1]),
                      "pending_bearish_signal":pending is not None}
          
          def one(row):
              result = {k:row[k] for k in ("market","symbol","name","entry_date")}
              if row.get("status") != "evaluated":
                  result["status"]="missing_daily_entry"
                  return result
              entry = row["entry_open"]
              result["entry_price"] = entry
              market = row["market"]
              calendar = calendars[market]
              expected = []
              for day in calendar.sessions_in_range(row["entry_date"], END):
                  expected.extend(pd.date_range(calendar.session_open(day), calendar.session_close(day),
                                                freq="5min",inclusive="left"))
              expected = pd.DatetimeIndex(expected)
              try:
                  data = yf.Ticker(row["symbol"]).history(start="2026-11-09", end="2026-11-18",
                              interval="5m", auto_adjust=False, prepost=False, raise_errors=True, timeout=20)
                  if data.empty or data.index.tz is None:
                      result["status"]="missing_intraday"
                      return result
                  data.index = data.index.tz_convert("UTC")
                  data = data[~data.index.duplicated()].sort_index()
                  data = data.loc[data.index < calendar.session_close(END)]
                  # Repair only missing/zero-volume bars and opening-price conflicts from finer observations.
                  observed = data.reindex(expected)
                  missing = observed["Volume"].isna() | (observed["Volume"] <= 0)
                  opening_conflict = expected[0] not in data.index or abs(float(data.loc[expected[0],"Open"])/entry-1)>0.01
                  result["repaired_from_1m"] = 0
                  if missing.any() or opening_conflict:
                      try:
                          fine = yf.Ticker(row["symbol"]).history(start=row["entry_date"], end="2026-11-18",
                              interval="1m", auto_adjust=False, prepost=False, raise_errors=True, timeout=15)
                          if not fine.empty and fine.index.tz is not None:
                              fine.index = fine.index.tz_convert("UTC")
                              aggregate = fine.resample("5min", origin="start_day").agg(
                                  {"Open":"first","High":"max","Low":"min","Close":"last","Volume":"sum"}).dropna()
                              for stamp, bar in aggregate.iterrows():
                                  if bar["Volume"] > 0 and (stamp not in data.index or float(data.loc[stamp,"Volume"]) <= 0
                                          or (stamp == expected[0] and opening_conflict)):
                                      for column in ("Open","High","Low","Close","Volume"):
                                          data.loc[stamp,column] = bar[column]
                                      result["repaired_from_1m"] += 1
                              data = data.sort_index()
                      except Exception as exc:
                          result["one_minute_fallback_error"] = type(exc).__name__
                  if expected[0] not in data.index:
                      result["status"]="missing_entry_bar"
                      return result
                  if abs(float(data.loc[expected[0],"Open"])/entry-1)>0.01:
                      result["status"]="daily_intraday_entry_mismatch"
                      return result
                  maps = {"fixed_2_6":{}, "support_5m_volume":sell_signals(data,5),
                          "support_15m_volume":sell_signals(data,15),
                          "lower_high_low_15m":sell_signals(data,15,True)}
                  result["expected_bars"] = len(expected)
                  result["received_bars"] = len(data.index.intersection(expected))
                  result["policies"] = {policy:simulate(data,expected,entry,maps[policy]) for policy in POLICIES}
                  result["status"]="paired" if all(x["status"]!="incomplete" for x in result["policies"].values()) else "incomplete_pair"
              except Exception as exc:
                  result["status"]="download_error"
                  result["error"]=type(exc).__name__
              print(json.dumps({k:result.get(k) for k in ("market","symbol","status")}),flush=True)
              return result
          
          # Regression checks for execution ordering, timing and open positions.
          idx = pd.date_range("2026-11-12T00:00:00Z",periods=8,freq="5min")
          frame = pd.DataFrame({"Open":100.0,"High":101.0,"Low":99.0,"Close":100.0,"Volume":100.0},index=idx)
          assert simulate(frame,idx,100,{})["status"]=="open_at_valuation"
          assert simulate(frame,idx,100,{idx[0]+pd.Timedelta(minutes=5):True})["exit_at"]==idx[1].isoformat()
          test = frame.copy(); test.loc[idx[0],["High","Low"]]=[107,97]
          assert simulate(test,idx,100,{})["reason"]=="stop_2pct"
          test = frame.copy(); test.loc[idx[1],["Open","High","Low","Close"]]=[95,96,94,95]
          assert simulate(test,idx,100,{})["exit_price"]==95
          test = frame.copy(); test.loc[idx[:3],["Open","High","Low","Close","Volume"]]=[
              [102,103,100,102,100],[102,103,101,102,100],[100,100,98,99,150]]
          signals = sell_signals(test,5)
          assert idx[2]+pd.Timedelta(minutes=5) in signals and idx[2] not in signals
          assert not sell_signals(test.iloc[:2],5)
          test.loc[idx[2],"Volume"]=149
          assert idx[2]+pd.Timedelta(minutes=5) not in sell_signals(test,5)
          print("Execution and signal regression checks passed",flush=True)
          
          with ThreadPoolExecutor(max_workers=3) as pool:
              trades = list(pool.map(one,orders))
          summary, coverage = {}, {}
          for market in ("KR","US"):
              rows = [row for row in trades if row["market"]==market]
              paired = [row for row in rows if row["status"]=="paired"]
              coverage[market] = {"candidate_entries":len(rows),"paired":len(paired),
                                 "excluded":{status:sum(row["status"]==status for row in rows)
                                             for status in sorted({row["status"] for row in rows if row["status"]!="paired"})}}
              summary[market] = {}
              for policy in POLICIES:
                  values = [row["policies"][policy] for row in paired]
                  closed = [v for v in values if v["status"]=="closed"]
                  returns = [v["net_pct"] for v in values]
                  delta = [row["policies"][policy]["net_pct"]-row["policies"]["fixed_2_6"]["net_pct"] for row in paired]
                  summary[market][policy] = {"paired_entries":len(values),"closed":len(closed),
                      "open_at_valuation":len(values)-len(closed),
                      "mean_marked_net_pct":statistics.mean(returns) if returns else None,
                      "positive_marked_pct":100*sum(r>0 for r in returns)/len(returns) if returns else None,
                      "closed_win_rate_pct":100*sum(v["net_pct"]>0 for v in closed)/len(closed) if closed else None,
                      "bearish_exits":sum(v.get("reason")=="bearish_signal" for v in closed),
                      "delta_vs_fixed_pp":statistics.mean(delta) if delta else None,
                      "improved":sum(v>1e-8 for v in delta),"worsened":sum(v < -1e-8 for v in delta)}
          result = {"candidate_period":["2026-11-09","2026-11-13"],"valuation_date":END,
                    "method":"Same archived candidate entries and daily opening fill assumption, regular-session 5m OHLC replay",
                    "cost_per_side_pct":COST*100,"coverage":coverage,"summary":summary,"trades":trades,
                    "limitations":["Intrabar ordering assumed stop first; actual quotes unavailable",
                    "Bearish exits execute next available 5m open, with overnight gaps when applicable",
                    "Open positions marked at Nov17 close with reserved exit cost, no forced liquidation",
                    "Missing and zero-volume bars before an exit invalidate that policy",
                    "Only cases valid for every policy enter paired comparisons",
                    "Small retrospective sample, no out-of-sample profitability established",
                    "Corporate/news-based sell signals not tested due missing point-in-time evidence",
                    "Same historical daily candidate proxy as prior report, not full live buy strategy"]}
          Path("exit-comparison-nov17.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print("EXIT_COMPARISON_RESULT="+json.dumps(result,ensure_ascii=False),flush=True)
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exit-comparison-nov17
          path: exit-comparison-nov17.json
          if-no-files-found: ignore
