name: Stop obsolete live runner
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/stop-obsolete-live-run.yml'
permissions:
  actions: write
  contents: read
jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel pre-policy US-early runner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: hsmun577-max/dual-market-scanner
        run: |
          status=$(gh run view 44472017219 --json status --jq .status)
          if [ "$status" != completed ]; then
            gh run cancel 44472017219
          fi
