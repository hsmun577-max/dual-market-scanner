name: Preopen composite decision verification
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/preopen-repair-check.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt 'exchange-calendars>=4.8,<5'
      - name: Verify valuation, risk gates, decision and message paths
        run: |
          PYTHONPATH=. python tests/test_preopen_signals.py
          PYTHONPATH=. python tests/test_entertainment_routing.py
          PYTHONPATH=. python tests/test_economic_graph.py
          PYTHONPATH=. python tests/test_event_impact_analysis.py
          PYTHONPATH=. python tests/test_composite_signal.py
          PYTHONPATH=. python tests/test_sector_leadership.py
          PYTHONPATH=. python tests/test_daily_delivery_update.py
          PYTHONPATH=. python tests/test_delivery_policy.py
      - name: Verify live read-only production analysis and decision
        env:
          GH_TOKEN: ${{ github.token }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python -u preopen_repair_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preopen-composite-verification
          path: preopen-repair-*
          if-no-files-found: ignore
