name: Final evidence refresh and requested alert
on:
  workflow_run:
    workflows: ['Repair and verify tradable signals']
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  refresh:
    if: github.event.workflow_run.id == 44670222160 && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt 'exchange-calendars>=4.8,<5'
      - name: Restore verified issuer analyses from the requested repair run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 44670222160 --repo hsmun577-max/dual-market-scanner -n repaired-tradable-signal-evidence -D prior-analysis
      - name: Refresh current news and sector evidence and send verified result
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u requested_buy_report.py --session 2026-11-20 --reuse-analysis prior-analysis/requested-buy-analysis.json
          python - <<'PY'
          import json
          report=json.load(open('requested-buy-analysis.json'))
          for row in report['results']:
              if not row.get('company_analysis'):continue
              f=row.get('company_forecast',{})
              print('FINAL_ISSUER_DECISION='+json.dumps(dict(symbol=row['symbol'],name=row.get('name'),
                  score=f.get('composite_score'),missing=f.get('missing_dimensions'),decision=row.get('preopen_decision'),
                  components=f.get('components'),news=row['company_analysis'].get('news_status'),
                  unread=row['company_analysis'].get('event_analysis',{}).get('unread_events')),ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-evidence-and-alert
          path: requested-buy-*
          if-no-files-found: ignore
