name: Verify native news evidence repair
on:
  push:
    paths: ['.github/workflows/evidence-provider-repair.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Verify actual native issuer timestamps and publisher article bodies
        run: |
          python -u - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import json
          from issuer_news import issuer_news_result
          from event_impact_analysis import company_news_events
          for symbol,name in [('352820','하이브'),('041510','에스엠'),('005930','삼성전자')]:
              now=datetime.now(ZoneInfo('Asia/Seoul'))
              result=issuer_news_result(symbol,name,now)
              company=dict(news=result['articles'][:5],news_status='ok' if result['articles'] else 'no_recent_articles')
              events=company_news_events(company)
              print('NATIVE_NEWS_REPAIR='+json.dumps(dict(symbol=symbol,name=name,status=result['status'],
                  native_articles=len(result['articles']),attempts=result['attempts'],
                  bodies=[dict(url=e['url'],headline=e['headline'],status=e['body_status'],characters=len(e['body']),
                      available_at=e['available_at'],availability_basis=e['availability_basis']) for e in events]),ensure_ascii=False),flush=True)
              if result['status']!='checked':raise RuntimeError('Native provider did not verify issuer feed')
          PY
