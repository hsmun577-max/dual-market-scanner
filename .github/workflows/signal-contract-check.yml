name: Tradable signal contract checks
on:
  push:
    paths:
      - 'tradable_signal.py'
      - 'execution_quotes.py'
      - 'kis_intraday.py'
      - 'valuation_data.py'
      - 'company_forecast.py'
      - 'industry_flow.py'
      - 'issuer_news.py'
      - 'news_provider.py'
      - 'analysis_batch.py'
      - 'preopen_signals.py'
      - 'tests/test_news_provider.py'
      - 'tests/test_analysis_batch.py'
      - 'tests/test_article_retry.py'
      - 'tests/test_public_article_limits.py'
      - 'tests/test_kis_session_cache.py'
      - 'scanner.py'
      - 'event_impact_analysis.py'
      - 'research_asset.py'
      - 'tests/test_evidence_repair.py'
      - 'tests/test_peer_expansion.py'
      - 'tests/test_tradable_signal.py'
      - '.github/workflows/signal-contract-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt 'exchange-calendars>=4.8,<5'
      - name: Preserve trade contracts and approved catalyst policy
        env:
          PYTHONPATH: tests
        run: python -m unittest test_tradable_signal test_execution_quotes test_peer_expansion test_evidence_repair test_optional_news test_event_impact_analysis test_composite_signal test_daily_delivery_update test_sector_leadership test_sector_update test_catalyst_policy test_preopen_signals test_kis_session_cache test_public_article_limits test_news_body_pipeline test_news_provider test_analysis_batch test_article_retry -q
