name: November 12 revised strategy replay
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nov12-replay.yml'
permissions:
  contents: read
  actions: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt 'exchange-calendars>=4.8,<5' pykrx
      - name: Stop superseded unbounded data probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 44537332639 || true
      - name: Reconstruct dated evidence and evaluate current buy rules
        env:
          GH_TOKEN: ${{ github.token }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -u replay_nov12_revised.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nov12-revised-replay-evidence
          path: nov12-evidence/
          if-no-files-found: error
