name: OpenDART document check
on:
  push:
    branches: [codex/dart-document-check-20261117]
    paths: [.github/workflows/dart-document-check.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt 'websockets>=14,<18'
      - env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python - <<'PY'
          import os, requests
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from kis_intraday import dart_contract_details, format_notification, KR_SYMBOL_NAMES
          key=os.environ.get("DART_API_KEY", "").strip()
          if not key:
              raise SystemExit("DART key unavailable")
          now=datetime.now(ZoneInfo("Asia/Seoul"))
          from io import BytesIO
          from zipfile import ZipFile, BadZipFile
          from xml.etree import ElementTree
          for receipt in ("20261117800641","20261117900571","20261117800497"):
              r=requests.get("https://opendart.fss.or.kr/api/document.xml",params={"crtfc_key":key,"rcept_no":receipt},timeout=6)
              try:
                  with ZipFile(BytesIO(r.content)) as z:
                      print("ZIP",receipt,z.namelist())
                      for name in z.namelist():
                          if name.lower().endswith(".xml"):
                              root=ElementTree.fromstring(z.read(name))
                              rows=[" ".join(" ".join(tr.itertext()).split()) for tr in root.iter("TR")]
                              print("ROWS",root.tag,len(rows),[row[:170] for row in rows if "매출액" in row or "계약금액" in row][:8])
              except BadZipFile:
                  try:
                      doc=ElementTree.fromstring(r.content)
                      print("DART_STATUS",receipt,r.status_code,doc.findtext("status"),doc.findtext("message"))
                  except ElementTree.ParseError:
                      print("INVALID",receipt,r.status_code)
          PY
