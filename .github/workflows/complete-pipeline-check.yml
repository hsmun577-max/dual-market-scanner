name: Complete pipeline verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  workflow_run:
    workflows: ['Full market issuer profile index']
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Compile repository Python
        run: python -m compileall -q .
      - name: Run every offline regression test
        run: |
          for test_file in tests/test_*.py; do
            PYTHONPATH=. python "$test_file"
          done
      - name: Verify live provider coverage without sending
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          from economic_graph import load_profiles,discover
          from event_impact_analysis import world_events
          from profile_universe import restore_index
          count=restore_index()
          profiles=load_profiles()
          events,coverage=world_events(datetime.now(timezone.utc))
          linked=discover(profiles,events,datetime.now(timezone.utc),limit=None)
          from economic_graph import select_analysis_candidates
          scan_path=Path("opening-scan/latest.json")
          priority={}
          if profiles:
              if not scan_path.is_file(): raise RuntimeError("Latest price scan not restored for priority validation")
              report=json.loads(scan_path.read_text(encoding="utf-8-sig"))
              for market in ("KR","US"):
                  pool=[row for row in report["results"] if row["market"]==market]
                  selected=select_analysis_candidates(pool,market,linked)
                  priority[market]=[{"symbol":row["symbol"],"name":row.get("name")}
                                    for row in selected if row["symbol"] in linked]
          coverage_files=list(Path("profile-download").rglob("profile-coverage.json"))
          index_coverage=json.loads(coverage_files[0].read_text()) if coverage_files else {"status":"initial_full_collection_not_available"}
          result={"profile_count":count,"event_candidate_count":len(linked),"analysis_event_priority":priority,"feed_coverage":coverage,"index_coverage":index_coverage,
                  "telegram_sent":False,"profitability_validated":False}
          Path("completed-pipeline-audit.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print("COMPLETED_PIPELINE_AUDIT="+json.dumps(result,ensure_ascii=False),flush=True)
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completed-pipeline-audit
          path: completed-pipeline-audit.json
          if-no-files-found: ignore
