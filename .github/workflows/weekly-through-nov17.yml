name: Weekly candidates through Nov 17
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/weekly-through-nov17.yml'
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt 'exchange-calendars>=4.8,<5'
      - name: Replay archived candidates to yesterday close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, math, os, subprocess, statistics
          from pathlib import Path
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          import yfinance as yf
          import exchange_calendars as xc
          from scanner import rank_korean_candidates
          
          START, END, EXIT = "2026-11-09", "2026-11-13", "2026-11-17"
          def gh(*args):
              return subprocess.run(["gh", *args], check=True, capture_output=True, text=True).stdout
          runs = json.loads(gh("run", "list", "--workflow", "scanner.yml",
                               "--status", "success", "--limit", "100", "--json", "databaseId,createdAt"))
          snapshots = {}
          issues = []
          for run in runs:
              if not "2026-11-09" <= run["createdAt"][:10] <= "2026-11-16":
                  continue
              folder = Path("historical-scans") / str(run["databaseId"])
              try:
                  gh("run", "download", str(run["databaseId"]), "--name", "scan-results", "--dir", str(folder))
                  report = json.loads(next(folder.rglob("latest.json")).read_text(encoding="utf-8-sig"))
                  generated = datetime.fromisoformat(report["generated_at"].replace("Z", "+00:00"))
              except Exception as exc:
                  issues.append({"run":run["databaseId"],"error":type(exc).__name__})
                  continue
              for market in ("KR", "US"):
                  zone = ZoneInfo("Asia/Seoul" if market == "KR" else "America/New_York")
                  calendar = xc.get_calendar("XKRX" if market == "KR" else "XNYS")
                  rows = [row for row in report["results"] if row.get("market") == market and row.get("indicators")]
                  days = sorted({row["indicators"]["data_date"] for row in rows if START <= row["indicators"]["data_date"] <= END})
                  for day in days:
                      if not calendar.is_session(day):
                          continue
                      next_day = calendar.next_session(day)
                      opening = calendar.session_open(next_day).to_pydatetime()
                      closing = calendar.session_close(day).to_pydatetime()
                      if not closing <= generated < opening:
                          continue
                      key = (market, day)
                      previous = snapshots.get(key)
                      if previous and previous["generated_at"] <= generated.isoformat():
                          continue
                      snapshots[key] = {"run":run["databaseId"],"generated_at":generated.isoformat(),
                                        "entry_date":str(next_day.date()),
                                        "rows":[row for row in rows if row["indicators"]["data_date"] == day]}
          orders, coverage = [], {}
          for market in ("KR", "US"):
              calendar = xc.get_calendar("XKRX" if market == "KR" else "XNYS")
              for session in calendar.sessions_in_range(START, END):
                  day = str(session.date())
                  snapshot = snapshots.get((market, day))
                  if not snapshot:
                      coverage[market+" "+day] = {"status":"missing_point_in_time_snapshot"}
                      continue
                  pool = [row for row in snapshot["rows"] if row["signal"]["stage"] in {"장전 관찰 후보","장중 조건부 진입 후보"}]
                  selected = rank_korean_candidates(pool) if market == "KR" else sorted(pool, key=lambda row:(-row["signal"]["score"],row["symbol"]))[:5]
                  coverage[market+" "+day] = {"scanned":len(snapshot["rows"]),"eligible":len(pool),
                                            "selected":len(selected),"run":snapshot["run"],"generated_at":snapshot["generated_at"]}
                  for row in selected:
                      orders.append({"market":market,"signal_date":day,"entry_date":snapshot["entry_date"],
                                     "symbol":row["symbol"],"name":row.get("name") or row["symbol"],
                                     "score":row["signal"]["score"],"snapshot_run":snapshot["run"]})
          tickers = sorted({row["symbol"] for row in orders})
          prices = yf.download(tickers, start=START, end="2026-11-18", auto_adjust=False,
                               group_by="ticker", progress=False, threads=4, timeout=20, actions=True)
          for row in orders:
              try:
                  data = prices[row["symbol"]] if len(tickers)>1 else prices
                  days = data.index.strftime("%Y-%m-%d")
                  entry = data.loc[days == row["entry_date"]].iloc[0]
                  exit = data.loc[days == EXIT].iloc[0]
                  before_exit = data.loc[(days >= row["entry_date"]) & (days <= EXIT)]
                  op, cl = float(entry["Open"]), float(exit["Close"])
                  if not math.isfinite(op) or not math.isfinite(cl) or min(op,cl)<=0:
                      raise ValueError("missing prices")
                  splits = before_exit.get("Stock Splits")
                  if splits is not None and any(float(x) not in (0,1) for x in splits.fillna(0)):
                      row["status"]="split_requires_separate_adjustment"
                      continue
                  row.update(status="evaluated",entry_open=op,exit_close=cl,
                             gross_pct=100*(cl/op-1),
                             net_pct=100*(cl*0.9985/(op*1.0015)-1),
                             worst_low_pct=100*(float(before_exit["Low"].min())/op-1))
              except Exception as exc:
                  row["status"]="missing_price"
                  row["error"]=type(exc).__name__
          summary = {}
          for market in ("KR","US"):
              trades = [row for row in orders if row["market"]==market and row["status"]=="evaluated"]
              summary[market] = {"evaluated_signals":len(trades),"unique_symbols":len({r["symbol"] for r in trades}),
                                "wins":sum(row["net_pct"]>0 for row in trades),
                                "win_rate_pct":100*sum(row["net_pct"]>0 for row in trades)/len(trades) if trades else None,
                                "mean_gross_pct":statistics.mean(row["gross_pct"] for row in trades) if trades else None,
                                "mean_net_pct":statistics.mean(row["net_pct"] for row in trades) if trades else None,
                                "worst_net_pct":min((row["net_pct"] for row in trades),default=None),
                                "best_net_pct":max((row["net_pct"] for row in trades),default=None)}
          result = {"period":[START,END],"valuation_date":EXIT,
                    "method":"Historical daily candidate proxy, next session open to 2026-11-17 close, 15 bps estimated cost per side",
                    "exact_current_intraday_strategy":False,
                    "missing_for_exact":["historical bid/ask quotes","timestamped company/news evidence","all-day intraday candidate universe"],
                    "coverage":coverage,"summary":summary,"trades":orders,"download_issues":issues,
                    "limitations":["No stop/target or 30-minute liquidation applied","Overlapping repeated signals are independent hypothetical trades, not portfolio returns","Dividends and FX excluded","US selection uses daily score, not premarket discovery"]}
          Path("weekly-through-nov17.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(result,ensure_ascii=False))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("Weekly historical candidate holding returns through Nov 17\n\n")
              f.write(json.dumps({"coverage":coverage,"summary":summary},ensure_ascii=False,indent=2))
          if not any(v["evaluated_signals"] for v in summary.values()):
              raise SystemExit("No historical candidates could be evaluated")
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-through-nov17
          path: weekly-through-nov17.json
          if-no-files-found: ignore
