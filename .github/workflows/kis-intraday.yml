name: Korea intraday Telegram

on:
  schedule:
    - cron: '30 21 * * 0-4'
    - cron: '30 22 * * 0-4'
  workflow_dispatch:
    inputs:
      market:
        description: Market to collect at its next opening window
        type: choice
        required: true
        options:
          - NXT
          - KRX

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt 'exchange-calendars>=4.8,<5' 'websockets>=14,<18'
      - name: Collect opening data and notify
        env:
          MARKET: ${{ inputs.market || (github.event.schedule == '30 21 * * 0-4' && 'NXT' || 'KRX') }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          python -u kis_intraday.py "$MARKET" 2>&1 | tee intraday-status.log
          result=${PIPESTATUS[0]}
          if [[ $result -ne 0 ]]; then
            printf '### 장중 수집 실패 (%s)\n\n' "$MARKET" >> "$GITHUB_STEP_SUMMARY"
            tail -n 1 intraday-status.log >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
      - name: Summarize replay without publishing raw quotes
        if: always()
        run: |
          for sample in ./*.jsonl; do
            if [[ -s "$sample" ]]; then
              python backtest_intraday.py "$sample" --fee-bps 10 > "${sample%.jsonl}-replay.json"
            fi
          done
      - name: Save intraday replay summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-replay
          path: '*-replay.json'
          if-no-files-found: ignore
