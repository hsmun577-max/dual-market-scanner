
name: Dual Market Scanner

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Full scan or listing validation
        type: choice
        options:
          - full
          - universe
        default: full
  schedule:
    - cron: '30 0 * * 1-5'
    - cron: '40 6 * * 1-5'
    - cron: '0 15 * * 1-5'
    - cron: '0 21 * * 1-5'

permissions:
  contents: read
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore issuer exposure profiles
        uses: actions/cache@v4
        with:
          path: reports/company-profiles.json
          key: issuer-profiles-v1-${{ github.run_id }}
          restore-keys: issuer-profiles-v1-

      - name: Restore full issuer exposure index
        env:
          GH_TOKEN: ${{ github.token }}
        run: python profile_universe.py --restore

      - name: Run scanner
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SCAN_MODE: ${{ inputs.mode || 'full' }}
        run: python scanner.py --mode "$SCAN_MODE"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: reports/
          if-no-files-found: warn
          retention-days: 30

