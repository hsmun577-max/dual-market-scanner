
name: Dual Market Scanner

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Full scan or listing validation
        type: choice
        options:
          - full
          - universe
        default: full
  schedule:
    - cron: '30 0 * * 1-5'
    - cron: '40 6 * * 1-5'
    - cron: '0 15 * * 1-5'
    - cron: '0 21 * * 1-5'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_MODE: ${{ inputs.mode || 'full' }}
        run: python scanner.py --mode "$SCAN_MODE"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: reports/
          if-no-files-found: warn
          retention-days: 30

