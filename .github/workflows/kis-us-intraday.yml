name: US premarket Telegram
run-name: US premarket ${{ inputs.window || (github.event.schedule == '30 2 * * 1-5' && 'US-early' || 'US-late') }}

on:
  schedule:
    - cron: '30 2 * * 1-5'
      timezone: America/New_York
    - cron: '50 6 * * 1-5'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      window:
        description: Premarket window or dependency check
        type: choice
        required: true
        default: check
        options:
          - check
          - US-early
          - US-late

permissions:
  contents: read
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      WINDOW: ${{ inputs.window || (github.event.schedule == '30 2 * * 1-5' && 'US-early' || 'US-late') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt 'exchange-calendars>=4.8,<5' 'websockets>=14,<18'
      - name: Verify runner
        if: env.WINDOW == 'check'
        run: python kis_intraday.py --help
      - name: Load same-day 04:15 candidates
        if: env.WINDOW == 'US-late'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(TZ=America/New_York date +%F)
          first_run=$(gh run list --workflow kis-us-intraday.yml --branch main --status success \
            --limit 20 --json databaseId,displayTitle,createdAt \
            --jq ".[] | select(.displayTitle == \"US premarket US-early\" and (.createdAt | startswith(\"$today\"))) | .databaseId" | head -n 1)
          if [[ -n "$first_run" ]]; then
            gh run download "$first_run" --name us-early-candidates || echo '04:15 snapshot unavailable'
          fi
      - name: Collect premarket data and notify
        if: env.WINDOW != 'check'
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          python -u kis_intraday.py "$WINDOW" 2>&1 | tee intraday-status.log
          result=${PIPESTATUS[0]}
          if [[ $result -ne 0 ]]; then
            printf '### 장중 수집 실패 (%s)\n\n' "$WINDOW" >> "$GITHUB_STEP_SUMMARY"
            tail -n 1 intraday-status.log >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
      - name: Save 04:15 candidates
        if: env.WINDOW == 'US-early'
        uses: actions/upload-artifact@v4
        with:
          name: us-early-candidates
          path: us-early-candidates.json
          if-no-files-found: ignore
          retention-days: 2
      - name: Summarize replay without publishing raw quotes
        if: always() && env.WINDOW != 'check'
        run: |
          for sample in ./*.jsonl; do
            if [[ -s "$sample" ]]; then
              python backtest_intraday.py "$sample" --fee-bps 10 > "${sample%.jsonl}-replay.json"
            fi
          done
      - name: Save intraday replay summary
        if: always() && env.WINDOW != 'check'
        uses: actions/upload-artifact@v4
        with:
          name: intraday-replay
          path: '*-replay.json'
          if-no-files-found: ignore
