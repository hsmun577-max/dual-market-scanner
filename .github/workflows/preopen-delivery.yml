name: Preopening analysis Telegram
on:
  workflow_dispatch:
    inputs:
      market:
        type: choice
        required: true
        options: [NXT, KRX, US_PRE, US]
  schedule:
    - cron: '40 4 * * 1-5'
      timezone: Asia/Seoul
    - cron: '40 5 * * 1-5'
      timezone: Asia/Seoul
    - cron: '40 0 * * 1-5'
      timezone: America/New_York
    - cron: '20 6 * * 1-5'
      timezone: America/New_York
permissions:
  contents: read
  actions: read
concurrency:
  group: preopen-${{ inputs.market || github.event.schedule }}
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MARKET: ${{ inputs.market || (github.event.schedule == '40 4 * * 1-5' && 'NXT' || github.event.schedule == '40 5 * * 1-5' && 'KRX' || github.event.schedule == '40 0 * * 1-5' && 'US_PRE' || 'US') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt 'exchange-calendars>=4.8,<5'
      - name: Prepare early and enforce the actual delivery deadline
        env:
          GH_TOKEN: ${{ github.token }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u preopen_delivery.py "$MARKET"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preopen-delivery-${{ env.MARKET }}
          path: preopen-delivery.json
          if-no-files-found: ignore
